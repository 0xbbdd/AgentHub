# AgentHub 反代网关 Docker 部署
#
# 启动: docker compose -f gateway/docker-compose.yml up -d --build
# 网关: http://<主机>:9527/v1 （OpenAI / Anthropic / Responses 兼容）
# 管理: http://<主机>:9528/api （管理 REST API）
#
# 与桌面版关联：
#   1. 配置同一个 WebDAV/S3 服务器（webdavShared），号池自动同步
#   2. 或手动在桌面版导出号池 JSON，在 Docker 版通过管理 API 导入
#
# 环境变量：
#   AGENTHUB_SECRET_KEY     凭据加密密钥（生产必须设置，否则明文存储）
#   AGENTHUB_PROXY_PORT     网关端口（默认 9527）
#   AGENTHUB_ADMIN_PORT     管理 API 端口（默认 9528）

services:
  agenthub-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: agenthub-gateway:local
    container_name: agenthub-gateway
    restart: unless-stopped
    ports:
      - "9527:9527"    # 反代网关（客户端连接此端口）
      - "9528:9528"    # 管理 API（管理操作走此端口）
    environment:
      AGENTHUB_SECRET_KEY: ${AGENTHUB_SECRET_KEY:-}
      AGENTHUB_PROXY_PORT: ${AGENTHUB_PROXY_PORT:-9527}
      AGENTHUB_ADMIN_PORT: ${AGENTHUB_ADMIN_PORT:-9528}
    volumes:
      - ./data:/data
    # 可选：Qoder 渠道需要挂载本机客户端目录（取消注释并按实际路径调整）
    # volumes:
    #   - ./data:/data
    #   - "/c/Users/<user>/AppData/Local/Programs/Qoder CN:/qoder-cn:ro"
    #   - "/c/Users/<user>/AppData/Roaming/com.qodercn.app.stable:/qoder-cn-data:ro"
